services:

  clientes-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: clientes_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - clientes_data:/var/lib/postgresql/data
      - ./db/clientes/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d clientes_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  pedidos-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pedidos_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pedidos_data:/var/lib/postgresql/data
      - ./db/pedidos/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pedidos_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:8
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    ports:
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: demo
      RABBITMQ_DEFAULT_PASS: demo
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  clientes-api:
    build: ./clientes-api
    environment:
      PORT: 3001
      DATABASE_URL: postgresql://postgres:postgres@clientes-db:5432/clientes_db
    ports:
      - "3001:3001"
    depends_on:
      clientes-db:
        condition: service_healthy

  pedidos-api:
    build: ./pedidos-api
    environment:
      PORT: 3002
      DATABASE_URL: postgresql://postgres:postgres@pedidos-db:5432/pedidos_db
      RABBITMQ_URL: amqp://demo:demo@rabbitmq:5672
      RABBITMQ_QUEUE: pedidos.events
    ports:
      - "3002:3002"
    depends_on:
      pedidos-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  proyector:
    build: ./proyector
    environment:
      RABBITMQ_URL: amqp://demo:demo@rabbitmq:5672
      RABBITMQ_QUEUE: pedidos.events
      CLIENTES_API_URL: http://clientes-api:3001
      MONGO_URL: mongodb://mongo:27017
      MONGO_DB: consultas_db
    depends_on:
      rabbitmq:
        condition: service_healthy
      mongo:
        condition: service_healthy
      clientes-api:
        condition: service_started

  consultas-api:
    build: ./consultas-api
    environment:
      PORT: 3003
      MONGO_URL: mongodb://mongo:27017
      MONGO_DB: consultas_db
    ports:
      - "3003:3003"
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  clientes_data:
  pedidos_data:
  mongo_data: